<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NZSMS Posts</title>
<style>
  :root {
    --bg: #f0f2f5; --card: #ffffff; --text: #050505; --muted: #65676b;
    --line: #ced0d4; --hover: #f2f2f2; --blue: #1877f2; --blue-dark: #166fe5;
    --danger: #d93025; --shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.34 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Login */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login { width: 100%; max-width: 396px; background: var(--card); border-radius: 8px;
           box-shadow: 0 2px 4px rgba(0,0,0,.1), 0 8px 16px rgba(0,0,0,.1); padding: 20px 16px 24px; }
  .brand { color: var(--blue); font-size: 34px; font-weight: 800; letter-spacing: -1px; text-align: center; margin: 0 0 4px; }
  .login p { color: var(--muted); text-align: center; margin: 0 0 16px; }
  .login input { width: 100%; padding: 14px 16px; font-size: 17px; border: 1px solid #dddfe2;
                 border-radius: 6px; margin-bottom: 12px; }
  .login input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px #e7f3ff; }
  .btn-primary { width: 100%; background: var(--blue); color: #fff; border: 0; border-radius: 6px;
                 font-size: 20px; font-weight: 700; padding: 10px; }
  .btn-primary:hover { background: var(--blue-dark); }
  .btn-primary:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--danger); text-align: center; min-height: 20px; margin-top: 12px; font-size: 14px; }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--card); box-shadow: var(--shadow);
            height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .topbar .brand { font-size: 26px; margin: 0; }
  .topbar .meta { color: var(--muted); font-size: 13px; }
  .btn-light { background: #e4e6eb; border: 0; border-radius: 6px; padding: 8px 12px; font-weight: 600; }
  .btn-light:hover { background: #d8dadf; }

  /* Feed */
  .feed { max-width: 590px; margin: 16px auto; padding: 0 16px; }
  .count { color: var(--muted); font-size: 13px; margin: 0 4px 12px; }
  .post { background: var(--card); border-radius: 8px; box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
  .post-head { display: flex; gap: 8px; align-items: center; padding: 12px 16px 0; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
            color: #fff; font-weight: 700; font-size: 15px; }
  .who { min-width: 0; }
  .who .name { font-weight: 600; overflow-wrap: anywhere; }
  .who .time { color: var(--muted); font-size: 13px; }
  .who .time a { color: inherit; text-decoration: none; }
  .who .time a:hover { text-decoration: underline; }
  .text { padding: 4px 16px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .text:empty { display: none; }
  .see-more { background: none; border: 0; padding: 0; color: var(--text); font-weight: 600; }
  .see-more:hover { text-decoration: underline; }

  .grid { display: grid; gap: 2px; background: var(--card); }
  .grid.n1 { grid-template-columns: 1fr; }
  .grid.n2 { grid-template-columns: 1fr 1fr; }
  .grid.n3 { grid-template-columns: 1fr 1fr; }
  .grid.n3 .cell:first-child { grid-column: 1 / -1; }
  .grid.n4 { grid-template-columns: 1fr 1fr; }
  .cell { position: relative; background: #e4e6eb; min-height: 120px; cursor: pointer; overflow: hidden; }
  .grid.n1 .cell { cursor: default; }
  .grid:not(.n1) .cell { aspect-ratio: 1 / 1; }
  .grid.n3 .cell:first-child { aspect-ratio: 16 / 9; }
  .cell img, .cell video { display: block; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .grid.n1 .cell img { height: auto; max-height: 680px; object-fit: contain; }
  .grid.n1 .cell video { height: auto; max-height: 680px; object-fit: contain; }
  .cell .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .more { position: absolute; inset: 0; background: rgba(0,0,0,.45); color: #fff; display: grid;
          place-items: center; font-size: 30px; font-weight: 700; }
  .badge { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.6); color: #fff;
           border-radius: 4px; padding: 2px 6px; font-size: 12px; pointer-events: none; }

  .linkbox { margin: 0 16px 12px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
             background: #f7f8fa; display: block; color: inherit; text-decoration: none; }
  .linkbox .cap { color: var(--muted); font-size: 12px; text-transform: uppercase; overflow-wrap: anywhere; }
  .linkbox .ttl { font-weight: 600; overflow-wrap: anywhere; }

  .stats { display: flex; justify-content: space-between; gap: 8px; padding: 10px 16px; color: var(--muted); font-size: 14px; }
  .stats .rx { display: flex; align-items: center; gap: 6px; }
  .rx-icons { display: inline-flex; }
  .rx-icons span { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
                   font-size: 10px; border: 2px solid var(--card); margin-left: -4px; }
  .rx-icons span:first-child { margin-left: 0; }
  .actions { display: flex; border-top: 1px solid var(--line); margin: 0 12px; padding: 4px 0; }
  .actions button { flex: 1; background: none; border: 0; border-radius: 6px; padding: 8px 4px;
                    color: var(--muted); font-weight: 600; font-size: 14px; }
  .actions button:hover { background: var(--hover); }

  /* Post pop-up */
  .modal { position: fixed; inset: 0; z-index: 10; background: rgba(244,244,244,.85); overflow-y: auto;
           padding: 24px 16px; }
  .modal-inner { max-width: 700px; margin: 0 auto; }
  .modal-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .modal .grid { grid-template-columns: 1fr !important; }
  .modal .cell { aspect-ratio: auto !important; cursor: default; grid-column: auto !important; }
  .modal .cell img, .modal .cell video { height: auto; max-height: 80vh; object-fit: contain; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #323436; color: #fff;
           padding: 10px 16px; border-radius: 6px; z-index: 20; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  @media (max-width: 600px) {
    .feed { padding: 0; margin-top: 8px; }
    .post { border-radius: 0; }
    .topbar .meta { display: none; }
    .modal { padding: 0; }
    .modal .post { border-radius: 0; }
    .modal-bar { padding: 8px; }
  }
</style>
</head>
<body>

<div class="login-wrap" id="login-view" hidden>
  <form class="login" id="login-form" autocomplete="on">
    <h1 class="brand">NZSMS Posts</h1>
    <p>Log in to view the posts.</p>
    <input id="username" name="username" placeholder="Username" autocomplete="username" required>
    <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn-primary" id="login-btn" type="submit">Log in</button>
    <div class="error" id="login-error" role="alert"></div>
  </form>
</div>

<div id="app-view" hidden>
  <header class="topbar">
    <div class="brand">NZSMS Posts</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="meta" id="published"></span>
      <button class="btn-light" id="logout">Log out</button>
    </div>
  </header>
  <main class="feed">
    <div class="count" id="count"></div>
    <div id="posts"></div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-inner">
    <div class="modal-bar"><button class="btn-light" id="modal-close">Close ✕</button></div>
    <div id="modal-post"></div>
  </div>
</div>

<script>
(() => {
  const KEY_STORE = "nzsms-key";
  const TEXT_LIMIT = 400;
  const $ = (id) => document.getElementById(id);
  let cfg = null, key = null, posts = [], byId = new Map();
  const blobUrls = new Map();

  // ---------- crypto
  const b64ToBytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const bytesToB64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));

  async function deriveRawKey(user, pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user + ":" + pass),
                                               "PBKDF2", false, ["deriveBits"]);
    return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64ToBytes(cfg.salt),
                                      iterations: cfg.iterations }, base, 256);
  }
  const importAesKey = (raw) => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);

  async function fetchDecrypted(path) {
    const res = await fetch(path, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const buf = new Uint8Array(await res.arrayBuffer());
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
  }

  async function unlock(raw) {
    key = await importAesKey(raw);
    const data = JSON.parse(new TextDecoder().decode(await fetchDecrypted("posts.enc")));
    posts = data.posts;
    byId = new Map(posts.map((p) => [p.id, p]));
    $("published").textContent = "Updated " + data.published;
  }

  // ---------- helpers
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const initials = (name) => name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
  function colourFor(name) {
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return `hsl(${h} 55% 45%)`;
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleString("en-NZ", { dateStyle: "medium", timeStyle: "short" });
  }
  const fmtNum = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M"
                      : n >= 1e4 ? Math.round(n / 1e3) + "K"
                      : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : String(n);
  const postUrl = (id) => location.href.split("#")[0] + "#post=" + encodeURIComponent(id);

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  // ---------- rendering
  function mediaHtml(p, full) {
    if (!p.media.length) return "";
    const shown = full ? p.media : p.media.slice(0, 4);
    const n = full ? 1 : Math.min(shown.length, 4);
    const extra = p.media.length - shown.length;
    const cells = shown.map((m, i) => `
      <div class="cell" data-src="${esc(m.src)}" data-mime="${esc(m.mime)}" data-type="${m.type}" data-post="${esc(p.id)}">
        <div class="loading">Loading…</div>
        ${m.type === "video" && !full && n > 1 ? '<span class="badge">▶ Video</span>' : ""}
        ${i === shown.length - 1 && extra > 0 ? `<div class="more">+${extra}</div>` : ""}
      </div>`).join("");
    return `<div class="grid n${n}">${cells}</div>`;
  }

  function statsHtml(s) {
    const parts = [];
    if (s.comments) parts.push(`${fmtNum(s.comments)} comment${s.comments === 1 ? "" : "s"}`);
    if (s.shares) parts.push(`${fmtNum(s.shares)} share${s.shares === 1 ? "" : "s"}`);
    if (s.views) parts.push(`${fmtNum(s.views)} views`);
    if (!s.reactions && !parts.length) return "";
    const rx = s.reactions ? `<span class="rx"><span class="rx-icons">
        <span style="background:#1877f2">👍</span><span style="background:#f33e58">❤</span></span>${fmtNum(s.reactions)}</span>` : "<span></span>";
    return `<div class="stats">${rx}<span>${parts.join(" · ")}</span></div>`;
  }

  function postHtml(p, full) {
    const long = !full && p.text.length > TEXT_LIMIT;
    const text = long ? esc(p.text.slice(0, TEXT_LIMIT).trimEnd()) + '… <button class="see-more" data-open="' + esc(p.id) + '">See more</button>'
                      : esc(p.text);
    const link = p.link ? `<a class="linkbox" href="${esc(p.link.url)}" target="_blank" rel="noopener noreferrer">
        <div class="cap">${esc(p.link.caption || new URL(p.link.url, location.href).hostname)}</div>
        <div class="ttl">${esc(p.link.name || p.link.url)}</div></a>` : "";
    return `<article class="post" data-id="${esc(p.id)}">
      <div class="post-head">
        <div class="avatar" style="background:${colourFor(p.name)}">${esc(initials(p.name))}</div>
        <div class="who"><div class="name">${esc(p.name)}</div>
          <div class="time"><a href="#post=${encodeURIComponent(p.id)}">${esc(fmtDate(p.time))}</a> · 🌐</div></div>
      </div>
      <div class="text">${text}</div>
      ${link}
      ${mediaHtml(p, full)}
      ${statsHtml(p.stats)}
      <div class="actions">
        <button data-copy="${esc(p.id)}">🔗 Copy link</button>
        ${full ? "" : `<button data-open="${esc(p.id)}">↗ Open post</button>`}
      </div>
    </article>`;
  }

  async function mediaUrl(src, mime) {
    if (!blobUrls.has(src)) {
      blobUrls.set(src, fetchDecrypted(src).then((buf) => URL.createObjectURL(new Blob([buf], { type: mime }))));
    }
    return blobUrls.get(src);
  }

  async function loadCell(cell) {
    if (cell.dataset.loaded) return;
    cell.dataset.loaded = "1";
    try {
      const url = await mediaUrl(cell.dataset.src, cell.dataset.mime);
      const inPopup = !!cell.closest("#modal");
      const single = cell.parentElement.classList.contains("n1");
      let el;
      if (cell.dataset.type === "video" && (inPopup || single)) {
        el = document.createElement("video");
        el.controls = true; el.playsInline = true; el.preload = "metadata"; el.src = url;
      } else if (cell.dataset.type === "video") {
        el = document.createElement("video");
        el.muted = true; el.preload = "metadata"; el.src = url + "#t=0.5";
      } else {
        el = document.createElement("img");
        el.alt = ""; el.src = url;
      }
      cell.querySelector(".loading").replaceWith(el);
    } catch (e) {
      cell.querySelector(".loading").textContent = "Couldn't load media";
    }
  }

  const observer = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) { observer.unobserve(e.target); loadCell(e.target); }
  }, { rootMargin: "600px 0px" });
  const watchMedia = (root) => root.querySelectorAll(".cell").forEach((c) => observer.observe(c));

  function renderFeed() {
    $("count").textContent = `${posts.length} post${posts.length === 1 ? "" : "s"}`;
    $("posts").innerHTML = posts.length ? posts.map((p) => postHtml(p, false)).join("")
                                        : '<div class="empty">No posts yet.</div>';
    watchMedia($("posts"));
  }

  // ---------- post pop-up (#post=<id>)
  function showFromHash() {
    const m = location.hash.match(/^#post=(.+)$/);
    const p = m && byId.get(decodeURIComponent(m[1]));
    if (!p) { closeModal(false); return; }
    $("modal-post").innerHTML = postHtml(p, true);
    $("modal").hidden = false;
    document.body.style.overflow = "hidden";
    $("modal").scrollTop = 0;
    watchMedia($("modal-post"));
  }
  function closeModal(updateHash = true) {
    $("modal").hidden = true;
    document.body.style.overflow = "";
    $("modal-post").querySelectorAll("video").forEach((v) => v.pause());
    $("modal-post").innerHTML = "";
    if (updateHash && location.hash) history.pushState("", document.title, location.pathname + location.search);
  }

  document.addEventListener("click", async (e) => {
    const open = e.target.closest("[data-open]");
    const copy = e.target.closest("[data-copy]");
    const cell = e.target.closest(".feed .cell");
    if (open) { location.hash = "post=" + encodeURIComponent(open.dataset.open); return; }
    if (copy) {
      const url = postUrl(copy.dataset.copy);
      try { await navigator.clipboard.writeText(url); toast("Link copied"); }
      catch { prompt("Copy this link:", url); }
      return;
    }
    if (cell && !cell.parentElement.classList.contains("n1")) {
      location.hash = "post=" + encodeURIComponent(cell.dataset.post);
    }
  });
  $("modal-close").onclick = () => closeModal();
  $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").hidden) closeModal(); });
  window.addEventListener("hashchange", () => { if (key) showFromHash(); });

  // ---------- login / start
  function showApp() {
    $("login-view").hidden = true;
    $("app-view").hidden = false;
    renderFeed();
    showFromHash();
  }
  function showLogin() {
    $("app-view").hidden = true;
    $("login-view").hidden = false;
    $("username").focus();
  }

  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("login-error").textContent = "";
    $("login-btn").disabled = true;
    $("login-btn").textContent = "Logging in…";
    try {
      const raw = await deriveRawKey($("username").value.trim(), $("password").value);
      await unlock(raw);
      try { localStorage.setItem(KEY_STORE, bytesToB64(raw)); } catch {}
      $("password").value = "";
      showApp();
    } catch (err) {
      $("login-error").textContent = err instanceof DOMException || err.name === "OperationError"
        ? "Incorrect username or password." : "Couldn't load the posts. Please try again.";
    } finally {
      $("login-btn").disabled = false;
      $("login-btn").textContent = "Log in";
    }
  });

  $("logout").onclick = () => {
    try { localStorage.removeItem(KEY_STORE); } catch {}
    location.href = location.pathname;
  };

  (async () => {
    try {
      cfg = await (await fetch("config.json", { cache: "no-cache" })).json();
    } catch {
      document.body.innerHTML = '<p class="empty">This site could not be loaded.</p>';
      return;
    }
    let saved = null;
    try { saved = localStorage.getItem(KEY_STORE); } catch {}
    if (saved) {
      try { await unlock(b64ToBytes(saved)); showApp(); return; }
      catch { try { localStorage.removeItem(KEY_STORE); } catch {} }
    }
    showLogin();
  })();
})();
</script>
</body>
</html>
